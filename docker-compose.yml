# 开发环境 PostgreSQL + pgvector — DESIGN §5.4（dev 5433，prod 本机 5432 见 §5.4.1）
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSKEY:-tc}
      POSTGRES_DB: topic_collection
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tc -d topic_collection"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
