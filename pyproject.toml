[project]
name = "topic-collection"
version = "0.1.0"
description = "主题信息聚合 + 个人知识库系统"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # 数据库
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # LLM / HTTP
    "httpx>=0.28",

    # 配置
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",

    # 抓取 / 清洗
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "selectolax>=0.3",

    # 中文处理
    "jieba>=0.42",

    # 语言检测
    "lingua-language-detector>=2.0",

    # 调度
    "apscheduler>=3.10",

    # CLI
    "typer>=0.15",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
tc = "app.services.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
